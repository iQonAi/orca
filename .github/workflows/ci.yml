name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # test/run.sh hard-fails without jq (it wires the SessionStart hook and
      # asserts on settings.json). git, setsid and pgrep — also required by the
      # suite — are already present on ubuntu-latest.
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Hermetic: temp HOMEs, temp git repos, a stub `gh` on PATH and
      # GH_WATCH_STATE_DIR keep it off the network and off any real state.
      - name: Run test suite
        run: bash test/run.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: shellcheck
        run: |
          shellcheck \
            install.sh \
            bin/orca \
            scripts/gh-watch.sh \
            hooks/orca-start-watcher.sh

  # Its own job, not a step next to shellcheck: a failing step aborts the rest
  # of its job, so sharing one job would hide this diff whenever shellcheck is
  # red — exactly when someone is most likely to be reading the logs.
  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: v3.14.0
      # Trust-on-first-use pin of the release asset, recorded 2026-09-10 from
      # the real download and cross-checked against the digest the GitHub API
      # reports for that asset. What it buys: the release tag is mutable, so
      # this stops its contents being swapped under us later. What it does not
      # buy: any evidence that this capture is the binary upstream intended —
      # mvdan/sh publishes no signed checksums, and that gap is accepted (#25).
      # The hash is tied to the version AND the architecture. Bumping
      # SHFMT_VERSION or moving to arm64 runners changes the artifact, so the
      # hash must be recaptured in the same commit; the check fails loudly
      # instead of being silently bypassed.
      SHFMT_SHA256: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          # Checked before chmod: a binary that fails the check is never made
          # executable.
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum --check -
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      # Blocking: every shell file must match `shfmt -i 2 -ci` (two-space indent,
      # indented `case` labels). A diff here fails the job; fix it with
      # `shfmt -i 2 -ci -w <file>`.
      - name: shfmt -d
        run: |
          shfmt -i 2 -ci -d \
            install.sh \
            bin/orca \
            scripts/gh-watch.sh \
            hooks/orca-start-watcher.sh \
            test/run.sh
